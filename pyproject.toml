[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-memory-reme"
version = "0.1.1"
description = "Community ReMe companion for evidence-first current facts and tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "SemanticMemory contributors" },
]
keywords = ["agents", "ai", "claims", "mcp", "memory", "reme"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
]

[project.scripts]
semantic-memory = "semantic_memory_reme.cli:main"
semantic-memory-mcp = "semantic_memory_reme.mcp:main"

[project.urls]
Homepage = "https://github.com/star-nebula/SemanticMemory"
Repository = "https://github.com/star-nebula/SemanticMemory"
Issues = "https://github.com/star-nebula/SemanticMemory/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semantic_memory_reme = ["py.typed"]
